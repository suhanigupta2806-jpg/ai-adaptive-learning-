<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - AdaptiveLearn</title>

    <link
        rel="stylesheet"
        href="css/auth.css"
    >

    <link
        rel="stylesheet"
        href="css/app-theme.css"
    >

</head>


<body>


    <div class="auth-container">


        <!-- ==================================================
             LEFT SIDE
        =================================================== -->

        <div class="auth-info">

            <div class="auth-logo">

                Adaptive<span>Learn</span>

            </div>


            <div class="info-content">

                <p class="auth-label">

                    AI-POWERED EXAM PREPARATION

                </p>


                <h1>

                    Welcome back.

                </h1>


                <p>

                    Continue your personalized learning journey,
                    practice your weak areas and keep building
                    your preparation streak.

                </p>

            </div>

        </div>



        <!-- ==================================================
             RIGHT SIDE
        =================================================== -->

        <div class="auth-form-container">


            <div class="auth-form">


                <a
                    href="index.html"
                    class="back-link"
                >

                    ← Back to Home

                </a>


                <h2>

                    Login

                </h2>


                <p class="form-subtitle">

                    Sign in to continue your preparation.

                </p>



                <!-- ==================================================
                     LOGIN FORM
                =================================================== -->

                <form id="loginForm">


                    <div class="form-group">


                        <label for="email">

                            Email Address

                        </label>


                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >


                    </div>



                    <div class="form-group">


                        <label for="password">

                            Password

                        </label>


                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >


                    </div>



                    <div class="form-options">


                        <label class="remember">


                            <input
                                type="checkbox"
                            >


                            Remember me


                        </label>



                        <a
                            href="forgot-password.html"
                        >

                            Forgot password?

                        </a>


                    </div>



                    <button
                        type="submit"
                        class="auth-button"
                    >

                        Login

                    </button>


                </form>



                <!-- ==================================================
                     DIVIDER
                =================================================== -->

                <div class="divider">

                    <span>

                        OR

                    </span>

                </div>



                <!-- ==================================================
                     REGISTER
                =================================================== -->

                <p class="register-text">


                    Don't have an account?


                    <a href="register.html">

                        Create Account

                    </a>


                </p>


            </div>


        </div>


    </div>



    <script src="js/auth.js"></script>


</body>

</html>
