<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password - AdaptiveLearn</title>


    <link
        rel="stylesheet"
        href="css/auth.css"
    >


    <link
        rel="stylesheet"
        href="css/app-theme.css"
    >

</head>


<body>


    <div class="auth-container">


        <!-- ==================================================
             LEFT SIDE
        =================================================== -->

        <div class="auth-info">


            <div class="auth-logo">

                Adaptive<span>Learn</span>

            </div>



            <div class="info-content">


                <p class="auth-label">

                    ACCOUNT RECOVERY

                </p>


                <h1>

                    Reset your password.

                </h1>


                <p>

                    Enter your registered email address
                    and choose a new password to continue
                    your preparation journey.

                </p>


            </div>


        </div>



        <!-- ==================================================
             RIGHT SIDE
        =================================================== -->

        <div class="auth-form-container">


            <div class="auth-form">


                <a
                    href="login.html"
                    class="back-link"
                >

                    ← Back to Login

                </a>



                <h2>

                    Forgot Password?

                </h2>



                <p class="form-subtitle">

                    Reset your password securely.

                </p>



                <!-- ==================================================
                     RESET FORM
                =================================================== -->

                <form id="forgotPasswordForm">


                    <!-- EMAIL -->

                    <div class="form-group">


                        <label for="forgotEmail">

                            Email Address

                        </label>


                        <input
                            type="email"
                            id="forgotEmail"
                            placeholder="Enter your registered email"
                            required
                        >


                    </div>



                    <!-- NEW PASSWORD -->

                    <div class="form-group">


                        <label for="newPassword">

                            New Password

                        </label>


                        <input
                            type="password"
                            id="newPassword"
                            placeholder="Create a new password"
                            minlength="6"
                            required
                        >


                    </div>



                    <!-- CONFIRM PASSWORD -->

                    <div class="form-group">


                        <label for="confirmNewPassword">

                            Confirm New Password

                        </label>


                        <input
                            type="password"
                            id="confirmNewPassword"
                            placeholder="Confirm your new password"
                            minlength="6"
                            required
                        >


                    </div>



                    <!-- RESET -->

                    <button
                        type="submit"
                        class="auth-button"
                    >

                        Reset Password

                    </button>


                </form>



                <p class="register-text">


                    Remember your password?


                    <a href="login.html">

                        Back to Login

                    </a>


                </p>


            </div>


        </div>


    </div>



    <script src="js/auth.js"></script>


</body>

</html>
